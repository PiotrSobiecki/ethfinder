version: 2
updates:
  # root pnpm-lock.yaml, jeden pakiet - jeden wpis
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "07:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # wszystkie patch/minor w jednym PR; majory zostaja osobno
      patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # obrazy bazowe w Dockerfile (node:22-alpine, nginx:alpine)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "07:00"
      timezone: "Europe/Warsaw"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # Od node 25 corepacka nie ma w obrazie, a Dockerfile bierze z niego pnpm.
      # Major wraca do gry, gdy pnpm przestanie zalezec od corepacka.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # wersje akcji w .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
