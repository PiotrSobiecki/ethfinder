# Naglowki bezpieczenstwa serwowane przy kazdej odpowiedzi.
#
# Plik jest wlaczany osobno w server{} i w kazdym location{}, ktory sam uzywa
# add_header: nginx nie dziedziczy add_header do bloku, ktory definiuje wlasny,
# wiec bez tego powtorzenia zasoby statyczne leciałyby bez naglowkow.
#
# script-src wymaga 'unsafe-inline', bo Next.js wstrzykuje inline bootstrap do
# index.html. 'unsafe-eval' celowo nie ma - bundle produkcyjny nie uzywa eval
# ani new Function (sprawdzone na out/_next/static/chunks).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
