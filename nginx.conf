user  nginx;
worker_processes  auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    server {
        # Railway kieruje ruch na 3000 (EXPOSE/PORT w Dockerfile). TLS konczy
        # sie na edge'u Railway, do kontenera wchodzi zwykly HTTP.
        listen 3000;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/snippets/security-headers.conf;

        location /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Dokument wejsciowy nie moze sie cache'owac na twardo, bo trzyma
        # odwolania do zahaszowanych bundli.
        location / {
            try_files $uri $uri/ /index.html;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # Zasoby maja hash w nazwie, wiec moga lezec w cache rok.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            include /etc/nginx/snippets/security-headers.conf;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }
    }
}
